name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions: CI only reads the repository. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    name: Build, test, publish (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build (warnings are errors)
        run: dotnet build TrayceMonitor.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test TrayceMonitor.slnx -c Release --no-build

      # Same NativeAOT publish the release uses, so a regression shows up on the pull request.
      # The windows-latest image ships the MSVC linker that NativeAOT needs.
      - name: Publish (NativeAOT)
        run: dotnet publish src/TrayceMonitor -c Release -o out/publish -p:TrayceAot=true

      - name: Check published executable
        shell: pwsh
        run: |
          $exe = 'out/publish/TrayceMonitor.exe'
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }
          '{0}: {1:N1} MB' -f $exe, ((Get-Item $exe).Length / 1MB)
