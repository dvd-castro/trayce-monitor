name: Release

# Runs when a version tag is pushed, for example:  git tag v0.1.0 && git push origin v0.1.0
# The tag is the single source of the version (passed to MSBuild as -p:Version).
on:
  push:
    tags: ["v*"]

# Minimal by default. Only the "publish" job gets contents: write.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    name: Build installer and portable zip
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Resolve version from the tag
        id: ver
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<v>\d+\.\d+\.\d+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?)$') {
            throw "Tag '$tag' is not a version tag (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix)."
          }
          $version = $Matches['v']
          # Pre-release while the version is 0.x or has a suffix such as -rc.1
          $pre = ($version -like '0.*' -or $version -like '*-*')
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "Version: $version (prerelease: $pre)"

      - name: Build (warnings are errors)
        run: dotnet build TrayceMonitor.slnx -c Release -warnaserror -p:Version=${{ steps.ver.outputs.version }}

      - name: Test
        run: dotnet test TrayceMonitor.slnx -c Release --no-build

      # Inno Setup 6.7.1 is preinstalled on the windows-2025 image (what windows-latest points to).
      # If a future image drops it, install the same pinned version from Chocolatey.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not ($candidates | Where-Object { Test-Path $_ })) {
            choco install innosetup --version=6.7.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }
          "ISCC: $iscc"

      - name: Package (NativeAOT publish, installer, zip, SHA256SUMS)
        shell: pwsh
        run: ./tools/build-release.ps1 -Version '${{ steps.ver.outputs.version }}' -Aot On -RequireInstaller

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            out/release/TrayceMonitor-*-win-x64-setup.exe
            out/release/TrayceMonitor-*-win-x64-portable.zip
            out/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Verify checksums
        working-directory: release
        run: |
          ls -l
          sha256sum --check SHA256SUMS.txt

      - name: Create the release
        uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          name: Trayce Monitor ${{ needs.build.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release/TrayceMonitor-${{ needs.build.outputs.version }}-win-x64-setup.exe
            release/TrayceMonitor-${{ needs.build.outputs.version }}-win-x64-portable.zip
            release/SHA256SUMS.txt
